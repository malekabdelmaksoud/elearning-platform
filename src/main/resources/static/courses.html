<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELearn — All Courses</title>
    <meta name="description" content="Browse all available courses on ELearn">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
    <a class="navbar-brand" href="dashboard.html">🎓 ELearn</a>
    <ul class="navbar-nav">
        <li><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li><a class="nav-link active" href="courses.html">Courses</a></li>
        <li><a class="nav-link" href="about.html">About</a></li>
        <li><a class="nav-link" href="profile.html">Profile</a></li>
    </ul>
    <div style="display:flex; align-items:center; gap:1rem;">
        <div class="user-badge">
            <span>👤</span>
            <span id="nav-username">...</span>
            <span id="nav-role" class="role-tag">...</span>
        </div>
        <button id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
    </div>
</nav>

<!-- Hero Banner -->
<div class="hero" style="padding:3rem 2rem;">
    <h1 style="font-size:2rem;">Explore All Courses</h1>
    <p>Find the course that suits you and start learning today.</p>
    <!-- Search + Add Course -->
    <div style="max-width:600px; margin:0 auto; display:flex; gap:0.8rem; align-items:center; flex-wrap:wrap; justify-content:center;">
        <div style="flex:1; min-width:250px; position:relative;">
            <input type="text" id="search-input" class="form-control"
                   placeholder="🔍  Search courses..."
                   style="padding-left:1.2rem; border-radius:50px; background:rgba(255,255,255,0.07);">
        </div>
        <button id="create-course-btn" class="btn btn-primary"
                style="display:none; border-radius:50px; padding:0.65rem 1.6rem;"
                onclick="openCreateModal()">
            + Add Course
        </button>
    </div>
</div>

<!-- Course Grid -->
<div class="container">
    <div class="section-header" style="margin-top:1.5rem;">
        <h2 id="courses-count-label">All Courses</h2>
    </div>
    <div id="courses-grid" class="course-grid">
        <div class="empty-state" style="grid-column:1/-1;">
            <div class="spinner"></div>
            <p style="margin-top:1rem; color:var(--text-muted);">Loading courses...</p>
        </div>
    </div>
</div>

<!-- Modal: Create Course (opens in same page) -->
<div id="create-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <h3>📚 Create New Course</h3>
            <button class="modal-close" onclick="closeCreateModal()">✕</button>
        </div>
        <div id="modal-alert" class="alert"></div>
        <form id="create-course-form">
            <div class="form-group">
                <label for="course-title">Course Title</label>
                <input type="text" id="course-title" class="form-control"
                       placeholder="e.g. Introduction to Java" required>
            </div>
            <div class="form-group">
                <label for="course-desc">Description</label>
                <textarea id="course-desc" class="form-control" rows="4"
                          placeholder="What will students learn?"></textarea>
            </div>
            <div style="display:flex; gap:0.8rem; justify-content:flex-end;">
                <button type="button" class="btn btn-outline" onclick="closeCreateModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">🚀 Create Course</button>
            </div>
        </form>
    </div>
</div>

<script src="js/courses.js"></script>
<script src="js/courses-page.js"></script>
</body>
</html>
