<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELearn — Login</title>
    <meta name="description" content="Login to ELearn e-learning platform">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-box">

        <div style="text-align:center; margin-bottom:2rem;">
            <div style="font-size:2.5rem; margin-bottom:0.5rem;">🎓</div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to your ELearn account</p>
        </div>

        <div id="alert-box" class="alert"></div>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control"
                       placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control"
                       placeholder="••••••••" required>
            </div>

            <button type="submit" id="login-btn" class="btn btn-primary btn-block">
                Sign In
            </button>
        </form>

        <div style="text-align:center; margin-top:1rem;">
            <a href="forgot-password.html" style="color:var(--primary); font-size:0.85rem; text-decoration:none;">
                🔑 Forgot Password?
            </a>
        </div>

        <div class="auth-link">
            Don't have an account? <a href="register.html">Create one</a>
        </div>


    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
