<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELearn — Register</title>
    <meta name="description" content="Create a new ELearn account">
    <link rel="icon" type="image/png" href="/favicon.png"><link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-box">

        <div style="text-align:center; margin-bottom:2rem;">
            <div style="font-size:2.5rem; margin-bottom:0.5rem;">✨</div>
            <h2>Create Account</h2>
            <p class="subtitle">Join ELearn as a student or teacher</p>
        </div>

        <div id="alert-box" class="alert"></div>

        <form id="register-form" novalidate>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="form-control"
                       placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control"
                       placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control"
                       placeholder="At least 6 characters" required>
            </div>

            <div class="form-group">
                <label for="role">I am a</label>
                <select id="role" class="form-control">
                    <option value="STUDENT">Student</option>
                    <option value="TEACHER">Teacher</option>
                </select>
            </div>

            <button type="submit" id="register-btn" class="btn btn-primary btn-block">
                Create Account
            </button>
        </form>

        <div class="auth-link">
            Already have an account? <a href="index.html">Sign in</a>
        </div>
    </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
